name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node dist/cli.js --version
      # Check that the built CLI runs on the oldest Node it supports (engines in package.json).
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v7
        with:
          node-version: '22.0.0'
      - if: matrix.os == 'ubuntu-latest'
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js --help
