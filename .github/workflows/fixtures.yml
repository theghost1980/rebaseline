name: fixtures

# Generates the saved Playwright reports used by the tests on Linux, one per
# Playwright version. Each job runs inside the official Playwright image of its
# version, which already has the matching browser and Node. To update the
# fixtures, download the artifacts into fixtures/reports/pw-<version>-linux/.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fixtures.yml
      - scripts/fixtures.mjs
      - fixtures/pw-project/**

permissions:
  contents: read

jobs:
  report:
    name: report (${{ matrix.playwright }})
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-jammy
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.40.1', '1.45.3', '1.50.1', '1.56.1', '1.64.1']
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - run: node --version && npm --version
      # Only the fixture script runs here: it needs fflate and Playwright, not the
      # dev tools, so install scripts and peer checks of the dev tools are skipped.
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm install --no-save --ignore-scripts --legacy-peer-deps @playwright/test@${{ matrix.playwright }}
      - run: npm run fixtures
      - uses: actions/upload-artifact@v7
        with:
          name: fixtures-pw-${{ matrix.playwright }}-linux
          path: fixtures/reports/pw-${{ matrix.playwright }}-linux/
          retention-days: 14
