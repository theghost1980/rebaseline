name: Bug report
description: Something did not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The command you ran and what it printed. Remove anything private, such as tokens or internal URLs.
      render: shell
  - type: input
    id: system
    attributes:
      label: System and terminal
      placeholder: macOS 26 with zsh in iTerm2, or Windows 11 with PowerShell 7 in Windows Terminal
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The output of `npx rebaseline@beta --version`, and your Playwright and Node.js versions.
      placeholder: rebaseline 0.1.0-beta.0, Playwright 1.64.1, Node.js 24.1.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did the report come from?
      options:
        - A local run (review)
        - GitHub Actions, one job (pull)
        - GitHub Actions, sharded (pull)
        - Other
    validations:
      required: true
