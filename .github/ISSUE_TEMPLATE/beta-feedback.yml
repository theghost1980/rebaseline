name: Beta feedback
description: Tell us how rebaseline went on your project, good or bad. Three questions.
title: 'Beta feedback: '
body:
  - type: input
    id: system
    attributes:
      label: System and terminal
      placeholder: macOS 26 with zsh, or Windows 11 with PowerShell 7
    validations:
      required: true
  - type: input
    id: playwright
    attributes:
      label: Playwright version
      placeholder: '1.64.1'
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How did it go?
      description: Did `pull` or `review` work the first time? What failed, confused you or was missing?
    validations:
      required: true
